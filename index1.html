<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Heartful Communication | Participant Portal (Sandbox)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col justify-between text-xs sm:text-sm">
    
    <!-- Persistent Global Header Logo -->
    <div id="global-header" class="max-w-md mx-auto w-full px-3 pt-2 hidden">
        <div class="bg-white rounded-lg shadow-sm p-0 overflow-hidden flex justify-center w-full">
            <img id="app-logo" src="" alt="App Logo" class="w-full h-auto object-cover block" />
        </div>
    </div>

    <!-- ANNOUNCEMENT BANNER (PLACED SAFELY HERE FOR TESTING) -->
    <div id="announcement-banner" class="max-w-md mx-auto w-full px-3 pt-2 hidden">
        <div class="p-4 bg-amber-50 border-2 border-amber-400 rounded-lg shadow-md transition-all duration-300 flex items-start justify-between">
            <div class="flex items-center space-x-3">
                <div class="flex-shrink-0 text-amber-500">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-amber-800 uppercase tracking-wide">Important Announcement</h3>
                    <p id="announcement-text" class="text-sm text-amber-900 mt-1 font-medium"></p>
                </div>
            </div>
            <button onclick="acknowledgeAnnouncement()" class="ml-4 px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-md shadow transition flex-shrink-0">
                Got it
            </button>
        </div>
    </div>

    <!-- Flashing Border CSS Animation -->
    <style>
    @keyframes borderFlash {
        0%, 100% { border-color: #f59e0b; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
        50% { border-color: #b45309; box-shadow: 0 0 10px 3px rgba(245, 158, 11, 0.6); }
    }
    .flashing-banner {
        animation: borderFlash 3s infinite;
    }
    </style>

    <!-- Top Header Bar -->
    <header id="app-header" class="max-w-md mx-auto px-3 pt-1 hidden w-full">
        <div class="bg-blue-50 border border-blue-200 text-blue-900 shadow-sm rounded-lg p-2.5 flex items-center justify-between w-full gap-2">
            <div id="header-user-info" class="text-xs overflow-hidden"></div>
            <div class="flex flex-shrink-0 items-center space-x-1.5">
                <button onclick="openUpdateProfileModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1 px-2 rounded transition shadow leading-tight text-center">
                    Update<br>Profile
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-[11px] font-bold py-2 px-2.5 rounded transition shadow">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-3 py-1 flex-grow w-full">
        <!-- SCREEN 1: LOGIN VIEW -->
        <div id="login-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1">
            <div id="login-workshop-badge" class="text-center mb-1 hidden">
                <span id="login-workshop-name" class="text-[10px] uppercase tracking-widest bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-semibold">--</span>
            </div>
            <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-2 text-center">Participant Login</h2>

            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Type your name in English (at least 3 letters):</label>
                <input type="text" id="search-name" autocomplete="off" placeholder="Type here.." class="w-full px-2.5 py-1 text-xs border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500" oninput="filterParticipants()">
                <div id="name-not-found-msg" class="text-red-500 text-[11px] mt-1 hidden"></div>
                <div id="search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-md shadow-lg max-h-32 overflow-y-auto hidden z-20 text-xs"></div>
            </div>

            <div id="selected-participant-container" class="mb-2 hidden">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Name of the Participant:</label>
                <input type="text" id="selected-participant-display" readonly class="w-full px-2.5 py-1 text-xs bg-gray-100 border rounded-md text-gray-600">
            </div>
            
            <div class="mb-3 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Password:</label>
                <div class="relative">
                    <input type="password" id="login-password" autocomplete="new-password" placeholder="Enter password" class="w-full px-2.5 py-1 text-xs pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="login-eye-icon" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 text-xs rounded-md transition mb-2">
                Login
            </button>

            <div class="flex justify-between items-center text-[11px] px-0.5">
                <a href="#" onclick="navToChangePassword(event)" class="text-indigo-600 hover:underline font-medium">Change Password</a>
                <a href="#" onclick="navToResetPassword(event)" class="text-indigo-600 hover:underline font-medium">Reset Password</a>
            </div>
        </div>

        <!-- SCREEN 2: DASHBOARD VIEW -->
        <div id="dashboard-screen" class="hidden space-y-1 mt-1">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-sm rounded-lg py-2 px-3 text-center">
                <h2 id="workshop-title-display" class="text-xs sm:text-sm font-bold"></h2>
                <div id="workshop-subtitle-display" class="text-[11px] sm:text-xs font-medium text-purple-200 mt-0.5"></div>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT FUNCTIONS BLOCK -->
    <script>
        let activeAnnouncementId = "";

        const monthMap = {
            "jan": 0, "feb": 1, "mar": 2, "apr": 3, "may": 4, "jun": 5,
            "jul": 6, "aug": 7, "sep": 8, "oct": 9, "nov": 10, "dec": 11
        };

        function parseCustomDateTime(dateStr, timeStr) {
            if (!dateStr || !timeStr) return 0;
            let dateParts = dateStr.split('-');
            let timeParts = timeStr.split(':');
            if (dateParts.length !== 3 || timeParts.length !== 2) return 0;
            let day = parseInt(dateParts[0], 10);
            let monthStr = dateParts[1].toLowerCase();
            let month = monthMap[monthStr];
            let year = parseInt(dateParts[2], 10);
            let hour = parseInt(timeParts[0], 10);
            let minute = parseInt(timeParts[1], 10);
            if (isNaN(day) || month === undefined || isNaN(year) || isNaN(hour) || isNaN(minute)) return 0;
            return new Date(year, month, day, hour, minute, 0).getTime();
        }

        function isCurrentTimeWithinWindow(startDate, startTime, endDate, endTime) {
            let now = new Date().getTime();
            let startTimestamp = parseCustomDateTime(startDate, startTime);
            let endTimestamp = parseCustomDateTime(endDate, endTime);
            if (startTimestamp === 0 || endTimestamp === 0) return true; 
            return now >= startTimestamp && now <= endTimestamp;
        }

        function checkAndDisplayAnnouncement(userRole, userUniqueId) {
            let dummyTestId = "HC-FT3H"; 
            if (userUniqueId !== dummyTestId) {
                let banner = document.getElementById('announcement-banner');
                if (banner) banner.classList.add('hidden');
                return;
            }

            db.ref('control_tower/announcements/current_announcement').once('value').then(snapshot => {
                const ann = snapshot.val();
                let banner = document.getElementById('announcement-banner');
                
                if (!ann || !ann.active) {
                    if (banner) banner.classList.add('hidden');
                    return;
                }

                activeAnnouncementId = ann.id;

                let userKey = userUniqueId || "guest";
                let acknowledgedId = localStorage.getItem('acknowledged_announcement_' + userKey);
                if (acknowledgedId === ann.id) {
                    if (banner) banner.classList.add('hidden');
                    return;
                }

                let allowedRoles = ann.target_roles ? ann.target_roles.split(',').map(r => r.trim().toLowerCase()) : [];
                let userRoleClean = (userRole || "").trim().toLowerCase();
                let isRoleMatched = allowedRoles.includes("all") || allowedRoles.includes(userRoleClean);
                if (!isRoleMatched) {
                    if (banner) banner.classList.add('hidden');
                    return;
                }

                if (!isCurrentTimeWithinWindow(ann.start_date, ann.start_time, ann.end_date, ann.end_time)) {
                    if (banner) banner.classList.add('hidden');
                    return;
                }

                document.getElementById('announcement-text').textContent = ann.message;
                if (banner) {
                    banner.classList.remove('hidden');
                    banner.classList.add('flashing-banner');
                }
            }).catch(err => {
                console.error("Error fetching announcement:", err);
            });
        }

        function acknowledgeAnnouncement() {
            let banner = document.getElementById('announcement-banner');
            if (banner) banner.classList.add('hidden');
            let userKey = (typeof currentActiveUser !== 'undefined' && currentActiveUser.ps_id) ? currentActiveUser.ps_id : "guest";
            if (activeAnnouncementId) {
                localStorage.setItem('acknowledged_announcement_' + userKey, activeAnnouncementId);
            }
        }
    </script>
</body>
</html>
