function filterParticipants() {
    const queryInput = document.getElementById('search-name');
    const query = queryInput ? queryInput.value.toLowerCase().trim() : "";
    const rawQuery = queryInput ? queryInput.value.trim() : ""; // Keeps original casing/script for the message
    const resultsBox = document.getElementById('search-results');
    const msgDiv = document.getElementById('name-not-found-msg');

    // Hide message box by default at the start of filtering
    if (msgDiv) msgDiv.classList.add('hidden');
    resultsBox.innerHTML = '';
    
    if (query.length < 3) {
        resultsBox.classList.add('hidden');
        return;
    }
    
    let matches = [];
    for (let key in allParticipants) {
        let p = allParticipants[key];
        
        // CHECK: Allow if workshop matches OR if the user has global "ALL" access (T&S admins)
        let pWorkshopId = p.workshop_id ? p.workshop_id.toString().trim().toUpperCase() : "";
        let pRole = p.role ? p.role.toString().trim().toUpperCase() : "";
        
        let isGlobalAdmin = (pWorkshopId === "ALL" || pRole === "T&S" || pRole === "TRUST & SAFETY");
        
        if (!isGlobalAdmin && pWorkshopId !== activeWorkshopId) {
            continue;
        }
        
        let pName = (p.ps_name || "").toLowerCase();
        if (pName.includes(query)) {
            matches.push({ key: key, data: p });
        }
    }
    
    if (matches.length > 0) {
        resultsBox.classList.remove('hidden');
        if (msgDiv) msgDiv.classList.add('hidden');
        
        matches.forEach(m => {
            let div = document.createElement('div');
            div.className = "px-4 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b bg-white";
            
            // Added Centre display alongside Name
            let nameStr = m.data.ps_name || "";
            let centreStr = m.data.ps_centre ? ` (${m.data.ps_centre})` : "";
            div.innerText = nameStr + centreStr;
            
            div.onclick = () => selectParticipant(m.key, m.data);
            resultsBox.appendChild(div);
        });
    } else {
        resultsBox.classList.add('hidden');
        // If 3 or more characters typed and no matches found, show the NVC-flavored warning message
        if (query.length >= 3 && msgDiv) {
            msgDiv.textContent = `We couldn't find a record for name "${rawQuery}"... Kindly connect with the HC Admin Team for support.`;
            msgDiv.classList.remove('hidden');
        }
    }
}

    const formatDateToDDMMMYYYY = (dateString) => {
        if (!dateString) return "";
        const parts = dateString.split("-");
        if (parts.length !== 3) return dateString;
        const y = parts[0];
        const m = parseInt(parts[1], 10);
        const d = parts[2];
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const monthStr = months[m - 1] || "Jan";
        return `${d}-${monthStr}-${y}`;

        for (let input of activeSessionInputs) {
            let currentDateVal = input.value;
            let currentNum = parseInt(input.getAttribute('data-session-num'));

            if (!currentDateVal) {
                showCustomAlert(`Please enter a date for Session ${currentNum}.`);
                return;
            }

            // Past Date Interlock
            if (currentDateVal < todayFormatted) {
                showCustomAlert(`Date Interlock Error:\nSession ${currentNum} date cannot be in the past.`);
                return;
            }

            // Sequential Order Interlock
            if (previousDateVal && currentDateVal < previousDateVal) {
                showCustomAlert(`Date Interlock Error:\nSession ${currentNum} date cannot be earlier than Session ${previousSessionNum} date.`);
                return;
            }

            previousDateVal = currentDateVal;
            previousSessionNum = currentNum;
        }

        // Strict Duplication Check in Firebase under control_tower/Launched_Workshops
        firebase.database().ref('control_tower/Launched_Workshops/' + customBatchId).once('value').then(snapshot => {
            if (snapshot.exists()) {
                showCustomAlert(`Duplicate Error:\nThe Batch ID "${customBatchId}" already exists in Launched Workshops. Please choose a unique Batch ID.`);
                return;
            }

            let template = masterWorkshopsData[selectedTemplateKey];
            let workshopName = template.workshop_name || "";
            
            let newBatchData = {
                workshop_id: customBatchId,
                workshop_name: workshopName,
                workshop_type: template.workshop_type || "",
                workshop_region: template.workshop_region || "",
                workshop_language: template.workshop_language || "",
                form_status: "Active"
            };

            for (let i = 1; i <= 14; i++) {
                if (template[`session_${i}_title`]) {
                    newBatchData[`session_${i}_title`] = template[`session_${i}_title`];
                    let dateInput = document.getElementById(`plan_session_date_${i}`);
                    // Format output as DD-MMM-YYYY before writing to Firebase
                    let rawDate = dateInput ? dateInput.value : "";
                    newBatchData[`session_${i}_date`] = formatDateToDDMMMYYYY(rawDate);
                }
            }

            // Save directly to Firebase
            firebase.database().ref('control_tower/Launched_Workshops/' + customBatchId).set(newBatchData)
                .then(() => {
                    showCustomAlert(`🎉 Success!\n\nWorkshop "${workshopName}" has been successfully launched with Batch ID: ${customBatchId}.`);
                    renderTshHub(currentActiveUser);
                })
                .catch(error => {
                    showCustomAlert("Failed to save workshop: " + error.message);
                });
        });
    });
}

// 1. Fetch Master List Zone State from Firebase when opening the profile modal
function fetchZoneStateMaster() {
    db.ref('control_tower/Master_List_Zone_State').once('value').then(snapshot => {
        const data = snapshot.val();
        if (data) {
            zoneStateMapping = data;
            populateStateDropdown();
        }
    }).catch(error => {
        console.error("Error fetching zone-state master:", error);
    });
}

// 2. Populate the State dropdown dynamically
function populateStateDropdown() {
    let stateSelect = document.getElementById('update-profile-state');
    if (!stateSelect) return;
    
    // Save current state value if any, to retain selection if re-opened
    let currentValue = stateSelect.value || (currentActiveUser ? currentActiveUser.ps_state : "");
    
    stateSelect.innerHTML = '<option value="">Select State</option>';
    
    Object.keys(zoneStateMapping).forEach(state => {
        let option = document.createElement('option');
        option.value = state;
        option.textContent = state;
        if (state === currentValue) {
            option.selected = true;
        }
        stateSelect.appendChild(option);
    });
    
    // Trigger zone population based on the selected state
    onStateSelected();
}

// 3. Automatically update Zone options when State changes
function onStateSelected() {
    let stateSelect = document.getElementById('update-profile-state');
    let zoneSelect = document.getElementById('update-profile-zone');
    
    if (!stateSelect || !zoneSelect) return;
    
    let selectedState = stateSelect.value;
    let currentZoneValue = zoneSelect.value || (currentActiveUser ? currentActiveUser.ps_zone : "");
    
    zoneSelect.innerHTML = '<option value="">Select Zone</option>';
    
    if (selectedState && zoneStateMapping[selectedState]) {
        zoneStateMapping[selectedState].forEach(zone => {
            let option = document.createElement('option');
            option.value = zone;
            option.textContent = zone;
            if (zone === currentZoneValue) {
                option.selected = true;
            }
            zoneSelect.appendChild(option);
        });
    }
}

        payload.ps_email = newEmail;
        updatedFieldsList.push("ps_email");
    }
    if (newCentre !== (currentActiveUser.ps_centre || "")) {

    }
    if (newCountry !== (currentActiveUser.ps_country || currentActiveUser.country || "")) {

    }
    if (newState !== (currentActiveUser.ps_state || "")) {
        payload.ps_state = newState;
        updatedFieldsList.push("ps_state");
    }

    if (Object.keys(payload).length === 0) {
        showCustomAlert("No changes detected to save.");
        return;

function validateEmailFormat(email) {
    if (!email) return false;
    
    // 1. Basic structural check (@ and single dot in domain)
    let re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!re.test(email)) return false;
    
    // 2. Prevent consecutive dots (e.g., test..email@gmail.com)
    if (email.includes('..')) return false;
    
    // 3. Split into local part and domain
    let parts = email.split('@');
    if (parts.length !== 2) return false;
    let localPart = parts[0];
    let domain = parts[1];
    
    // 4. Local part or domain cannot start or end with a dot
    if (localPart.startsWith('.') || localPart.endsWith('.') || domain.startsWith('.') || domain.endsWith('.')) {
        return false;
    }
    
    // 5. Ensure domain has at least one valid top-level domain (TLD) of at least 2 characters, 
    // and prevent bizarre multi-level gibberish extensions like .comfdfdf.in.fdsf
    let domainParts = domain.split('.');
    let tld = domainParts[domainParts.length - 1];
    if (tld.length < 2) return false;
    
    // Optional: restrict maximum TLD length to avoid absurd entries (e.g. max 6-7 chars for standard TLDs)
    if (tld.length > 10) return false;

    return true;
}

function parseCustomDateString(dateStr) {

// 2. Updated Access Evaluator
function evaluateWorkshopAccess(workshop) {
    let now = new Date(); 
    let startDate = parseCustomDateString(workshop.from_date); 
    let endDate = parseCustomDateString(workshop.to_date);
    
    let gracePeriodEnd = new Date(endDate.getTime() + (24 * 60 * 60 * 1000));
    
    let accessStatus = {
        resourcesUnlocked: false,
        workshopActive: true
    };

    if (now >= startDate) {
        accessStatus.resourcesUnlocked = true;
    }

    if (now > gracePeriodEnd) {
        accessStatus.workshopActive = false;
        accessStatus.resourcesUnlocked = false; 
    }

    return accessStatus;
}

		let activeAnnouncementId = "";

const monthMap = {
    "jan": 0, "feb": 1, "mar": 2, "apr": 3, "may": 4, "jun": 5,
    "jul": 6, "aug": 7, "sep": 8, "oct": 9, "nov": 10, "dec": 11
};

function parseCustomDateTime(dateStr, timeStr) {
    if (!dateStr || !timeStr) return 0;
    let dateParts = dateStr.split('-');
    let timeParts = timeStr.split(':');
    if (dateParts.length !== 3 || timeParts.length !== 2) return 0;
    let day = parseInt(dateParts[0], 10);
    let monthStr = dateParts[1].toLowerCase();
    let month = monthMap[monthStr];
    let year = parseInt(dateParts[2], 10);
    let hour = parseInt(timeParts[0], 10);
    let minute = parseInt(timeParts[1], 10);
    if (isNaN(day) || month === undefined || isNaN(year) || isNaN(hour) || isNaN(minute)) return 0;
    return new Date(year, month, day, hour, minute, 0).getTime();
}

function isCurrentTimeWithinWindow(startDate, startTime, endDate, endTime) {
    let now = new Date().getTime();
    let startTimestamp = parseCustomDateTime(startDate, startTime);
    let endTimestamp = parseCustomDateTime(endDate, endTime);
    if (startTimestamp === 0 || endTimestamp === 0) return true; 
    return now >= startTimestamp && now <= endTimestamp;
}

            if (banner) banner.classList.add('hidden');
            return;
        }

        // Assign message and show banner safely
        document.getElementById('announcement-text').textContent = ann.message;
        if (banner) {
            banner.classList.remove('hidden');
            banner.classList.add('flashing-banner');
        }
    }).catch(err => {
        console.error("Error fetching announcement:", err);
    });
}




		
function acknowledgeAnnouncement() {
    let banner = document.getElementById('announcement-banner');
    if (banner) banner.classList.add('hidden');
    let userKey = (typeof currentActiveUser !== 'undefined' && currentActiveUser.ps_id) ? currentActiveUser.ps_id : "guest";
    if (activeAnnouncementId) {
        localStorage.setItem('acknowledged_announcement_' + userKey, activeAnnouncementId);
    }
}
