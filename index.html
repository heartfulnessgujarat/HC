<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Events Registration System - Participant Portal</title>
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">



<!-- Top User Info Card (Single Column, 4 Rows) -->
<div class="bg-blue-50 border border-blue-200 text-blue-900 shadow-sm rounded-xl p-4 mb-3 max-w-xl mx-auto flex justify-between items-center">
    <div id="header-user-info" class="w-full">
        <!-- Populated dynamically via renderDashboard -->
    </div>
    <button onclick="logout()" class="ml-4 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 px-4 rounded transition shadow">Logout</button>
</div>

<!-- Middle Workshop Banner Box (Different Light Color: Soft Amber/Yellow or Emerald) -->
<div class="bg-amber-50 border border-amber-200 text-amber-900 shadow-sm rounded-xl py-3 px-6 text-center mb-3 max-w-xl mx-auto">
    <h2 id="workshop-title-display" class="text-base font-bold"></h2>
</div>

<!-- Bottom Resources Box Container (Different Light Color: Soft Slate/Gray or Neutral) -->
<div class="bg-white border border-gray-200 shadow-sm rounded-xl max-w-xl mx-auto overflow-hidden mb-3">
    <div class="bg-gray-100 px-6 py-3 border-b border-gray-200 text-center font-bold text-gray-700 text-sm">
        Participant Resources
    </div>
    <div id="resources-container">
        <!-- Resource rows injected dynamically -->
    </div>
</div>

    


    <!-- Main Container - Constrained compact mobile-friendly width matching Screenshot 1603 style -->
    <main class="max-w-xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- SCREEN 1: LOGIN VIEW -->
        <div id="login-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6">
            <!-- Dynamic workshop name above title -->
            <div id="login-workshop-badge" class="text-center mb-2 hidden">
                <span id="login-workshop-name" class="text-xs uppercase tracking-widest bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-semibold">--</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Participant Login</h2>
            
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="search-name" placeholder="e.g. Raj" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterParticipants()">
                <div id="search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>

            <!-- Conditionally shown Participant Name container (hidden until selection) -->
            <div id="selected-participant-container" class="mb-4 hidden">
                <label class="block text-gray-700 text-sm font-bold mb-2">Name of the Participant:</label>
                <input type="text" id="selected-participant-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
            </div>

            <div class="mb-6 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="Enter password" class="w-full px-3 py-2 pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="login-eye-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition mb-4">
                Login
            </button>

            <!-- Separate Footer Links: Change Password & Reset Password -->
            <div class="flex justify-between items-center text-sm px-1">
                <a href="#" onclick="showChangePasswordScreen()" class="text-indigo-600 hover:underline font-medium">Change Password</a>
                <a href="#" onclick="showResetPasswordScreen()" class="text-indigo-600 hover:underline font-medium">Reset Password</a>
            </div>
        </div>


        
        <!-- SCREEN 2: DASHBOARD VIEW -->
        <div id="dashboard-screen" class="hidden space-y-6">
            <!-- Center Workshop Title Banner -->

            <!-- Updated Middle Box HTML -->
<div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md rounded-xl py-3 px-6 text-center mb-6">
    <h2 id="workshop-title-display" class="text-lg font-bold"></h2>
</div>



           
            

            <!-- Participant Resources Table -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="bg-gray-100 px-6 py-4 border-b text-center">
                    <h3 class="text-lg font-bold text-gray-800">Participant Resources</h3>
                </div>
                <div class="divide-y divide-gray-200" id="resources-container">
                    <!-- Dynamically injected rows -->
                </div>
            </div>
        </div>

        <!-- SCREEN 3: CHANGE PASSWORD SCREEN -->
        <div id="change-password-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Change Password</h2>
            
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="cp-search-name" placeholder="e.g. Raj" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterChangePasswordParticipants()">
                <div id="cp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Name of the Participant:</label>
                <input type="text" id="cp-selected-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600" placeholder="Selected participant name">
            </div>

            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Current Password:</label>
                <div class="relative">
                    <input type="password" id="cp-current-password" placeholder="Current Password" class="w-full px-3 py-2 pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-current-password', 'cp-eye-1')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-1" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">New Password (Max 6 Chars):</label>
                <div class="relative">
                    <input type="password" id="cp-new-password" placeholder="New Password" maxlength="6" class="w-full px-3 py-2 pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-new-password', 'cp-eye-2')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-2" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mb-6 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Confirm New Password:</label>
                <div class="relative">
                    <input type="password" id="cp-confirm-password" placeholder="Confirm New Password" maxlength="6" class="w-full px-3 py-2 pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-confirm-password', 'cp-eye-3')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-3" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button onclick="submitChangePassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition mb-3">
                Update Password
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                Back to Login
            </button>
        </div>

        <!-- SCREEN 4: RESET PASSWORD SCREEN -->
        <div id="reset-password-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Reset Password</h2>
            
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="rp-search-name" placeholder="e.g. Raj" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterResetPasswordParticipants()">
                <div id="rp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Name of the Participant:</label>
                <input type="text" id="rp-selected-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600" placeholder="Selected participant name">
            </div>

            <button onclick="submitResetPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition mb-3">
                Reset Password to 123456
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                Back to Login
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-500">
        Heartful Communication - Participant Login System
    </footer>

    <!-- Firebase & Dynamic App Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAt_HbqtG_kMn41NC1wPy5KDFNsDp5HTb8",
            authDomain: "hc-app-72298.firebaseapp.com",
            databaseURL: "https://hc-app-72298-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hc-app-72298",
            storageBucket: "hc-app-72298.firebasestorage.app",
            messagingSenderId: "1013251414152",
            appId: "1:1013251414152:web:3e598848e31a81bb43273d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allParticipants = {};
        let allWorkshops = {};
        let currentActiveUser = null;
        let selectedParticipantKey = null;
        
        let cpSelectedKey = null;
        let rpSelectedKey = null;





function loadFirebaseData() {
            db.ref('control_tower').once('value').then(snapshot => {
                const data = snapshot.val();
                console.log("Firebase Raw Data Loaded for control_tower:", data);
                if (data) {
                    allParticipants = data.participants || {};
                    allWorkshops = data.workshops || {};
                    
                    console.log("Parsed allParticipants:", allParticipants);
                    console.log("Parsed allWorkshops:", allWorkshops);
                    
                    updateLoginWorkshopBadge();
                } else {
                    console.warn("Firebase returned empty data for control_tower.");
                }
            }).catch(err => console.error("Error fetching data from Firebase:", err));
        }

        window.onload = loadFirebaseData;

        function updateLoginWorkshopBadge() {
            let workshopKeys = Object.keys(allWorkshops);
            console.log("Workshop Keys available:", workshopKeys);
            if (workshopKeys.length > 0) {
                let firstWorkshop = allWorkshops[workshopKeys[0]];
                console.log("First Workshop Object:", firstWorkshop);
                if (firstWorkshop && firstWorkshop.workshop_name) {
                    document.getElementById('login-workshop-name').innerText = firstWorkshop.workshop_name;
                    document.getElementById('login-workshop-badge').classList.remove('hidden');
                }
            }
        }










        function renderDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('change-password-screen').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('app-header').classList.remove('hidden');

            let pName = currentActiveUser.ps_name || "Participant";
            let pId = currentActiveUser.ps_id || "N/A";
            let pMob = maskMobile(currentActiveUser.ps_mob);
            let pEmail = maskEmail(currentActiveUser.ps_email);

            const headerInfo = document.getElementById('header-user-info');
            headerInfo.innerHTML = `
                <div class="grid grid-cols-1 gap-y-1 text-xs sm:text-sm">
                    <div><strong>Name:</strong> ${pName}</div>
                    <div><strong>Unique ID Number:</strong> ${pId}</div>
                    <div><strong>Mobile Number:</strong> ${pMob}</div>
                    <div><strong>Email Address:</strong> ${pEmail}</div>
                </div>
            `;

            let wId = currentActiveUser.workshop_id;
            let workshop = allWorkshops[wId] || {};
            let workshopName = workshop.workshop_name || "Workshop Name Not Available";
            document.getElementById('workshop-title-display').innerText = workshopName;

            const resourcesContainer = document.getElementById('resources-container');
            resourcesContainer.innerHTML = '';

            const resourceLinks = [
                { title: "Personalized zoom link to join the workshop", link: currentActiveUser.personal_zoom_link },
                { title: "Participant WhatsApp Group Joining Link", link: workshop.participant_wg_link },
                { title: "Workshop Schedule Link", link: workshop.workshop_shedule_link },
                { title: "Material/Handbook Link", link: workshop.material_link },
                { title: "Participant Feedback Link", link: workshop.participant_feedback_link }
            ];

            resourceLinks.forEach(res => {
                let row = document.createElement('div');
                row.className = "px-6 py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center hover:bg-gray-50 transition border-b border-gray-100 last:border-b-0";
                
                let linkVal = res.link ? res.link.toString().trim() : "";
                let isLinkValid = linkVal.startsWith('http://') || linkVal.startsWith('https://');

                let titleSpan = document.createElement('span');
                titleSpan.className = "text-gray-800 font-medium text-xs sm:text-sm mb-2 sm:mb-0";
                titleSpan.innerText = res.title;
                row.appendChild(titleSpan);

                if (isLinkValid) {
                    let a = document.createElement('a');
                    a.href = linkVal;
                    a.target = "_blank";
                    a.className = "bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1.5 px-3 rounded transition shadow";
                    a.innerText = "Access Link";
                    row.appendChild(a);
                } else {
                    let span = document.createElement('span');
                    span.className = "text-gray-400 text-xs italic";
                    span.innerText = "Not Available";
                    row.appendChild(span);
                }

                resourcesContainer.appendChild(row);
            });
        }













        

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                input.type = "password";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function filterParticipants() {
            const query = document.getElementById('search-name').value.toLowerCase();
            const resultsBox = document.getElementById('search-results');
            resultsBox.innerHTML = '';

            if (query.length < 3) {
                resultsBox.classList.add('hidden');
                return;
            }

            let matches = [];
            for (let key in allParticipants) {
                let p = allParticipants[key];
                let pName = (p.ps_name || "").toLowerCase();
                if (pName.includes(query)) {
                    matches.push({ key: key, data: p });
                }
            }

            if (matches.length > 0) {
                resultsBox.classList.remove('hidden');
                matches.forEach(m => {
                    let div = document.createElement('div');
                    div.className = "px-4 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b bg-white";
                    div.innerText = m.data.ps_name;
                    div.onclick = () => selectParticipant(m.key, m.data);
                    resultsBox.appendChild(div);
                });
            } else {
                resultsBox.classList.add('hidden');
            }
        }

        function selectParticipant(key, data) {
            selectedParticipantKey = key;
            document.getElementById('search-name').value = data.ps_name;
            document.getElementById('selected-participant-display').value = data.ps_name;
            document.getElementById('selected-participant-container').classList.remove('hidden');
            document.getElementById('search-results').classList.add('hidden');
        }

        function handleLogin() {
            const passwordInput = document.getElementById('login-password').value;
            if (!selectedParticipantKey || !allParticipants[selectedParticipantKey]) {
                alert("Please search and select a valid participant.");
                return;
            }

            let user = allParticipants[selectedParticipantKey];
            let storedPassword = user.password ? user.password.toString() : "123456";

            if (passwordInput === storedPassword) {
                currentActiveUser = user;
                renderDashboard();
            } else {
                alert("Incorrect password. Please try again.");
            }
        }

        function filterChangePasswordParticipants() {
            const query = document.getElementById('cp-search-name').value.toLowerCase();
            const resultsBox = document.getElementById('cp-search-results');
            resultsBox.innerHTML = '';

            if (query.length < 3) {
                resultsBox.classList.add('hidden');
                return;
            }

            let matches = [];
            for (let key in allParticipants) {
                let p = allParticipants[key];
                let pName = (p.ps_name || "").toLowerCase();
                if (pName.includes(query)) {
                    matches.push({ key: key, data: p });
                }
            }

            if (matches.length > 0) {
                resultsBox.classList.remove('hidden');
                matches.forEach(m => {
                    let div = document.createElement('div');
                    div.className = "px-4 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b bg-white";
                    div.innerText = m.data.ps_name;
                    div.onclick = () => {
                        cpSelectedKey = m.key;
                        document.getElementById('cp-search-name').value = m.data.ps_name;
                        document.getElementById('cp-selected-display').value = m.data.ps_name;
                        resultsBox.classList.add('hidden');
                    };
                    resultsBox.appendChild(div);
                });
            } else {
                resultsBox.classList.add('hidden');
            }
        }

        function submitChangePassword() {
            if (!cpSelectedKey || !allParticipants[cpSelectedKey]) {
                alert("Please search and select a valid participant.");
                return;
            }

            const currentPass = document.getElementById('cp-current-password').value.trim();
            const newPass = document.getElementById('cp-new-password').value.trim();
            const confirmPass = document.getElementById('cp-confirm-password').value.trim();

            if (!currentPass || !newPass || !confirmPass) {
                alert("Please fill in all password fields.");
                return;
            }

            if (newPass !== confirmPass) {
                alert("New password and confirm password do not match.");
                return;
            }

            let user = allParticipants[cpSelectedKey];
            let storedPass = user.password ? user.password.toString() : "123456";

            if (currentPass !== storedPass) {
                alert("Current password is incorrect.");
                return;
            }

            db.ref('control_tower/participants/' + cpSelectedKey).update({ password: newPass }).then(() => {
                alert("Password successfully updated!");
                allParticipants[cpSelectedKey].password = newPass;
                showLoginScreen();
            }).catch(err => {
                alert("Failed to update password.");
            });
        }

        function filterResetPasswordParticipants() {
            const query = document.getElementById('rp-search-name').value.toLowerCase();
            const resultsBox = document.getElementById('rp-search-results');
            resultsBox.innerHTML = '';

            if (query.length < 3) {
                resultsBox.classList.add('hidden');
                return;
            }

            let matches = [];
            for (let key in allParticipants) {
                let p = allParticipants[key];
                let pName = (p.ps_name || "").toLowerCase();
                if (pName.includes(query)) {
                    matches.push({ key: key, data: p });
                }
            }

            if (matches.length > 0) {
                resultsBox.classList.remove('hidden');
                matches.forEach(m => {
                    let div = document.createElement('div');
                    div.className = "px-4 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b bg-white";
                    div.innerText = m.data.ps_name;
                    div.onclick = () => {
                        rpSelectedKey = m.key;
                        document.getElementById('rp-search-name').value = m.data.ps_name;
                        document.getElementById('rp-selected-display').value = m.data.ps_name;
                        resultsBox.classList.add('hidden');
                    };
                    resultsBox.appendChild(div);
                });
            } else {
                resultsBox.classList.add('hidden');
            }
        }

        function submitResetPassword() {
            if (!rpSelectedKey || !allParticipants[rpSelectedKey]) {
                alert("Please search and select a valid participant.");
                return;
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(() => {
                        alert("Password reset to 123456");
                        allParticipants[rpSelectedKey].password = "123456";
                        showLoginScreen();
                    })
                    .withFailureHandler((err) => {
                        alert("Failed to sync reset password: " + err.message);
                    })
                    .updateParticipantPassword(rpSelectedKey, "123456");
            } else {
                db.ref('control_tower/participants/' + rpSelectedKey).update({ password: "123456" }).then(() => {
                    alert("Password reset to 123456");
                    allParticipants[rpSelectedKey].password = "123456";
                    showLoginScreen();
                }).catch(err => {
                    alert("Failed to reset password.");
                });
            }
        }

        function maskMobile(mob) {
            if (!mob) return "***";
            let s = mob.toString().trim();
            if (s.length <= 4) return "****";
            return s.substring(0, 2) + "****" + s.substring(s.length - 2);
        }

        function maskEmail(email) {
            if (!email || !email.includes("@")) return "***@***.com";
            let parts = email.toString().trim().split("@");
            let name = parts[0];
            let domain = parts[1];
            let maskedName = name.length > 2 ? name.substring(0, 2) + "***" : "***";
            return maskedName + "@" + domain;
        }









        


        function showLoginScreen() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('change-password-screen').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('app-header').classList.add('hidden');
            clearForms();
        }

        function showChangePasswordScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('change-password-screen').classList.remove('hidden');
            document.getElementById('reset-password-screen').classList.add('hidden');
            clearForms();
        }

        function showResetPasswordScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('change-password-screen').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.remove('hidden');
            clearForms();
        }

        function logout() {
            currentActiveUser = null;
            selectedParticipantKey = null;
            showLoginScreen();
        }

        function clearForms() {
            document.getElementById('search-name').value = '';
            document.getElementById('selected-participant-display').value = '';
            document.getElementById('selected-participant-container').classList.add('hidden');
            document.getElementById('login-password').value = '';
            
            document.getElementById('cp-search-name').value = '';
            document.getElementById('cp-selected-display').value = '';
            document.getElementById('cp-current-password').value = '';
            document.getElementById('cp-new-password').value = '';
            document.getElementById('cp-confirm-password').value = '';
            cpSelectedKey = null;

            document.getElementById('rp-search-name').value = '';
            document.getElementById('rp-selected-display').value = '';
            rpSelectedKey = null;
        }
    </script>
