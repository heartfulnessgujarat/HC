<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Heartful Communication | Portal</title>

    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .hidden { display: none !important; }
        #fixed-top-shell.is-frozen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .fixed-inner {
            max-width: 448px;
            margin: 0 auto;
            padding: 8px 12px;
            box-sizing: border-box;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col justify-between text-xs sm:text-sm">

    <!-- Frozen Top Shell for Dashboard Banner Image + User Profile Bar -->
    <div id="fixed-top-shell">
        <div class="fixed-inner space-y-1.5">
            <!-- Persistent Global Header Logo (Full-width box fit) -->
            <div id="global-header" class="w-full hidden">
                <div class="bg-white rounded-lg shadow-sm p-0 overflow-hidden flex justify-center w-full">
                    <img id="app-logo" src="" alt="App Logo" class="w-full h-auto object-cover block" style="max-height: 84px;" />
                </div>
            </div>

            <!-- Top Header Bar -->
            <header id="app-header" class="hidden w-full">
                <div class="bg-blue-50 border border-blue-200 text-blue-900 shadow-sm rounded-lg p-2 flex items-start justify-between w-full gap-2">
                    <div id="header-user-info" class="text-[11px] leading-snug overflow-hidden">
                        <!-- Populated dynamically via JS -->
                    </div>
                    <div class="flex flex-shrink-0 flex-col gap-1">
                        <button type="button" onclick="openUpdateProfileModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold py-1 px-2 rounded transition shadow leading-tight text-center">
                            Update<br>Profile
                        </button>
                        <button type="button" onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-[10px] font-bold py-1.5 px-2 rounded transition shadow leading-tight text-center">
                            Logout
                        </button>
                    </div>
                </div>
            </header>
        </div>
    </div>

    <!-- Main Container -->
    <main id="main-container" class="max-w-md mx-auto px-3 py-1 flex-grow w-full">
        <!-- SCREEN 1: LOGIN VIEW -->
        <div id="login-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1">
            <div id="login-workshop-badge" class="text-center mb-1 hidden">
                <span id="login-workshop-name" class="text-[10px] uppercase tracking-widest bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-semibold">--</span>
            </div>
            <h2 id="login-screen-heading" class="text-base sm:text-lg font-bold text-gray-800 mb-2 text-center">Participant Login</h2>

            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Type your name in English (at least 3 letters):</label>
                <input type="text" id="search-name" autocomplete="off" placeholder="Type here.." class="w-full px-2.5 py-1 text-xs border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500" oninput="filterParticipants()">
                <div id="name-not-found-msg" class="text-red-500 text-[11px] mt-1 hidden"></div>
                <div id="search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-md shadow-lg max-h-32 overflow-y-auto hidden z-20 text-xs"></div>
            </div>

            <div id="selected-participant-container" class="mb-2 hidden">
                <label id="selected-participant-label" class="block text-gray-700 text-[11px] font-bold mb-0.5">Name of the Participant:</label>
                <input type="text" id="selected-participant-display" readonly class="w-full px-2.5 py-1 text-xs bg-gray-100 border rounded-md text-gray-600">
            </div>

            <!-- Password + Login section: ONLY shown if selected user has pw_changed === TRUE -->
            <div id="returning-user-password-section" class="hidden">
                <div class="mb-3 relative">
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Password:</label>
                    <div class="relative">
                        <input type="password" id="login-password" autocomplete="new-password" placeholder="Enter password" class="w-full px-2.5 py-1 text-xs pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                            <svg id="login-eye-icon" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1
