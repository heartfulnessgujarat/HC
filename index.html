
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartful Communication - Facilitator Training Workshop (FT3H) | Participant Portal</title>
    
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between text-xs sm:text-sm">
    
    <!-- Persistent Global Header Logo (Full width fit matching container) -->
    <div id="global-header" class="max-w-md mx-auto w-full px-3 pt-2 hidden">
        <div class="bg-white rounded-lg shadow-sm p-1.5 overflow-hidden flex justify-center">
            <img id="app-logo" src="" alt="App Logo" class="w-full h-auto max-h-24 sm:max-h-28 object-contain" />
        </div>
    </div>
    
    <!-- Top Header Bar -->
    <header id="app-header" class="max-w-md mx-auto px-3 pt-1 hidden w-full">
        <div class="bg-blue-50 border border-blue-200 text-blue-900 shadow-sm rounded-lg p-2.5 flex flex-col sm:flex-row justify-between items-start sm:items-center w-full">
            <div id="header-user-info" class="w-full mb-1.5 sm:mb-0 text-xs">
                <!-- Populated dynamically via renderDashboard -->
            </div>
            <div class="flex-shrink-0 self-end sm:self-center flex space-x-1.5">
                <button onclick="openUpdateProfileModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1 px-2.5 rounded transition shadow">
                    Update Profile
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-[11px] font-bold py-1 px-2.5 rounded transition shadow">
                    Logout
                </button>
            </div>
        </div>
    </header>
    
    <!-- Main Container with tightened spacing -->
    <main class="max-w-md mx-auto px-3 py-1 flex-grow w-full">
        <!-- SCREEN 1: LOGIN VIEW -->
        <div id="login-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1">
            <div id="login-workshop-badge" class="text-center mb-1 hidden">
                <span id="login-workshop-name" class="text-[10px] uppercase tracking-widest bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-semibold">--</span>
            </div>
            <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-2 text-center">Participant Login</h2>
            
            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Type your name in English (at least 3 letters):</label>
                <input type="text" id="search-name" autocomplete="off" placeholder="Type here.." class="w-full px-2.5 py-1 text-xs border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500" oninput="filterParticipants()">
                <div id="search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-md shadow-lg max-h-32 overflow-y-auto hidden z-20 text-xs"></div>
            </div>
            
            <div id="selected-participant-container" class="mb-2 hidden">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Name of the Participant:</label>
                <input type="text" id="selected-participant-display" readonly class="w-full px-2.5 py-1 text-xs bg-gray-100 border rounded-md text-gray-600">
            </div>
            
            <div class="mb-3 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Password:</label>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="Enter password" class="w-full px-2.5 py-1 text-xs pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="login-eye-icon" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 text-xs rounded-md transition mb-2">
                Login
            </button>
            
            <div class="flex justify-between items-center text-[11px] px-0.5">
                <a href="#" onclick="showChangePasswordScreen()" class="text-indigo-600 hover:underline font-medium">Change Password</a>
                <a href="#" onclick="showResetPasswordScreen()" class="text-indigo-600 hover:underline font-medium">Reset Password</a>
            </div>
        </div>
        
        <!-- SCREEN 2: DASHBOARD VIEW -->
        <div id="dashboard-screen" class="hidden space-y-2 mt-1">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-sm rounded-lg py-1.5 px-3 text-center">
                <h2 id="workshop-title-display" class="text-xs sm:text-sm font-bold"></h2>
            </div>
           
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="bg-gray-100 px-3 py-1.5 border-b text-center">
                    <h3 class="text-xs sm:text-sm font-bold text-gray-800">Participant Resources</h3>
                </div>
                <!-- Resource rows container with compact layout -->
                <div class="divide-y divide-gray-200 text-xs" id="resources-container">
                    <!-- Dynamically injected rows using vertical stack structure -->
                </div>
            </div>
        </div>

        <!-- SCREEN 3: CHANGE PASSWORD SCREEN -->
        <div id="change-password-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1 hidden text-xs">
            <h2 class="text-base font-bold text-gray-800 mb-2.5 text-center">Change Password</h2>
            
            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Type your name in English (at least 3 letters):</label>
                <input type="text" id="cp-search-name" placeholder="e.g. Raj" class="w-full px-2.5 py-1 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500" oninput="filterChangePasswordParticipants()">
                <div id="cp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-md shadow-lg max-h-32 overflow-y-auto hidden z-20"></div>
            </div>
            <div class="mb-2">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Name of the Participant:</label>
                <input type="text" id="cp-selected-display" readonly class="w-full px-2.5 py-1 bg-gray-100 border rounded-md text-gray-600" placeholder="Selected participant name">
            </div>
            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Current Password:</label>
                <div class="relative">
                    <input type="password" id="cp-current-password" placeholder="Current Password" class="w-full px-2.5 py-1 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-current-password', 'cp-eye-1')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-1" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">New Password (Max 6 Chars):</label>
                <div class="relative">
                    <input type="password" id="cp-new-password" placeholder="New Password" maxlength="6" class="w-full px-2.5 py-1 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-new-password', 'cp-eye-2')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-2" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mb-3 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Confirm New Password:</label>
                <div class="relative">
                    <input type="password" id="cp-confirm-password" placeholder="Confirm New Password" maxlength="6" class="w-full px-2.5 py-1 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('cp-confirm-password', 'cp-eye-3')" class="absolute inset-y-0 right-0 px-2 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="cp-eye-3" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button onclick="submitChangePassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 rounded-md transition mb-2">
                Update Password
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded-md transition">
                Back to Login
            </button>
        </div>

        <!-- SCREEN 4: RESET PASSWORD SCREEN -->
        <div id="reset-password-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1 hidden text-xs">
            <h2 class="text-base font-bold text-gray-800 mb-2.5 text-center">Reset Password</h2>
            
            <div class="mb-2 relative">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Type your name in English (at least 3 letters):</label>
                <input type="text" id="rp-search-name" placeholder="e.g. Raj" class="w-full px-2.5 py-1 border rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500" oninput="filterResetPasswordParticipants()">
                <div id="rp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-md shadow-lg max-h-32 overflow-y-auto hidden z-20"></div>
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Name of the Participant:</label>
                <input type="text" id="rp-selected-display" readonly class="w-full px-2.5 py-1 bg-gray-100 border rounded-md text-gray-600" placeholder="Selected participant name">
            </div>
            <button onclick="submitResetPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 rounded-md transition mb-2">
                Reset Password to 123456
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded-md transition">
                Back to Login
            </button>
        </div>

        <!-- SCREEN 5: UPDATE PROFILE SCREEN -->
        <div id="update-profile-screen" class="bg-white rounded-lg shadow-md p-3 sm:p-4 mt-1 hidden text-xs">
            <h2 class="text-base font-bold text-gray-800 mb-2.5 text-center">Update Profile Details</h2>
            
            <div class="space-y-2">
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Name (Read-only)</label>
                    <input type="text" id="update-profile-name" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Unique ID Number (Read-only)</label>
                    <input type="text" id="update-profile-id" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                </div>
                
                <!-- Mobile Number Field -->
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Mobile Number</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="text" id="update-profile-mob" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-mob" onclick="enableField('mob')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-3 rounded-md transition flex-shrink-0">Edit</button>
                    </div>
                </div>

                <!-- Email Address Field -->
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Email Address</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="email" id="update-profile-email" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-email" onclick="enableField('email')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-3 rounded-md transition flex-shrink-0">Edit</button>
                    </div>
                </div>

                <!-- Centre Field -->
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Centre</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="text" id="update-profile-centre" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-centre" onclick="enableField('centre')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-3 rounded-md transition flex-shrink-0">Edit</button>
                    </div>
                </div>

                <!-- State Field (Dropdown) -->
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">State</label>
                    <div class="flex items-center space-x-1.5">
                        <select id="update-profile-state" disabled onchange="onStateSelected()" class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                            <option value="">Select State</option>
                        </select>
                        <button type="button" id="btn-state" onclick="enableField('state')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-3 rounded-md transition flex-shrink-0">Edit</button>
                    </div>
                </div>

                <!-- Zone Field (Cascading Dropdown) -->
                <div>
                    <label class="block text-gray-700 text-[11px] font-bold mb-0.5">Zone</label>
                    <div class="flex items-center space-x-1.5">
                        <select id="update-profile-zone" disabled class="w-full bg-gray-100 border rounded-md px-2.5 py-1 text-gray-600 cursor-not-allowed">
                            <option value="">Select Zone</option>
                        </select>
                        <button type="button" id="btn-zone" onclick="enableField('zone')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-3 rounded-md transition flex-shrink-0">Edit</button>
                    </div>
                </div>
            </div>
            
            <!-- Loading status text -->
            <p id="profile-update-status" class="text-xs text-blue-600 font-medium hidden my-2 text-center"></p>
            
            <div class="mt-3 space-y-2">
                <button id="save-profile-btn" onclick="saveProfileChanges()" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-1.5 px-3 rounded-md cursor-not-allowed transition text-xs">
                    Save Changes
                </button>
                <button onclick="closeUpdateProfileModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded-md transition text-xs">
                    Cancel / Back to Dashboard
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-1.5 text-[10px] text-gray-500">
        Heartful Communication - Participant Login System
    </footer>

    <!-- Custom Message Box Modal -->
    <div id="custom-alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-3">
        <div class="bg-white rounded-lg shadow-xl max-w-xs w-full p-4 text-center transform transition-all text-xs">
            <div id="custom-alert-message" class="text-gray-800 text-xs mb-4 font-medium"></div>
            <button onclick="closeCustomAlert()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-1.5 px-4 rounded transition shadow">
                OK
            </button>
        </div>
    </div>

    <!-- Custom Verification Modal -->
    <div id="customVerificationModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-3">
        <div class="bg-white rounded-lg p-4 max-w-xs w-full mx-auto shadow-xl text-xs">
            <h3 class="text-sm font-semibold text-gray-800 mb-1.5">Enter Verification Code</h3>
            <p id="modalMessage" class="text-[11px] text-gray-600 mb-3">A 6-digit verification code has been sent to your email.</p>
            
            <input type="text" id="verificationInput" maxlength="6" placeholder="Enter 6-digit code" 
                class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 mb-3 text-center tracking-widest text-sm">
            
            <div class="flex justify-end space-x-1.5">
                <button onclick="closeVerificationModal()" class="px-3 py-1 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 text-xs">Cancel</button>
                <button onclick="handleVerifyCodeClick()" class="px-3 py-1 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 text-xs">Verify</button>
            </div>
        </div>
    </div>
    
    <script>



const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZwp6CgVUqLM9LUWob9FvgiioA3S5sACYHlkOD7RiopRucNaHzP8IsAcKMEARKbunH3A/exec";


        
        const firebaseConfig = {
            apiKey: "AIzaSyAt_HbqtG_kMn41NC1wPy5KDFNsDp5HTb8",
            authDomain: "hc-app-72298.firebaseapp.com",
            databaseURL: "https://hc-app-72298-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hc-app-72298",
            storageBucket: "hc-app-72298.firebasestorage.app",
            messagingSenderId: "1013251414152",
            appId: "1:1013251414152:web:3e598848e31a81bb43273d"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        let allParticipants = {};
        let allWorkshops = {};
        let currentActiveUser = null;
        let selectedParticipantKey = null;
        
        let cpSelectedKey = null;
        let rpSelectedKey = null;
        
        function loadFirebaseData() {
            db.ref('control_tower').once('value').then(snapshot => {
                const data = snapshot.val();
                console.log("Firebase Raw Data Loaded for control_tower:", data);
                if (data) {
                    allParticipants = data.participants || {};
                    allWorkshops = data.workshops || {};
                    
                    console.log("Parsed allParticipants:", allParticipants);
                    console.log("Parsed allWorkshops:", allWorkshops);
                    
                    updateLoginWorkshopBadge();
                } else {
                    console.warn("Firebase returned empty data for control_tower.");
                }
            }).catch(err => console.error("Error fetching data from Firebase:", err));
    
            // Fetch and display persistent global header logo based on Firebase control config
            db.ref('control_tower/config/logo_config').on('value', (snapshot) => {
                const config = snapshot.val();
                console.log("Logo Config fetched:", config);
                
                const logoContainer = document.getElementById('global-header');
                const logoElement = document.getElementById('app-logo');
                
                if (config && config.status === "ON" && config.image) {
                    logoElement.src = config.image;
                    logoContainer.classList.remove('hidden'); // Show logo box
                } else {
                    logoContainer.classList.add('hidden');    // Hide completely if OFF or empty
                }
            });
        }
        window.onload = loadFirebaseData;

        function updateLoginWorkshopBadge() {
            let workshopKeys = Object.keys(allWorkshops);
            console.log("Workshop Keys available:", workshopKeys);
            if (workshopKeys.length > 0) {
                let firstWorkshop = allWorkshops[workshopKeys[0]];
                console.log("First Workshop Object:", firstWorkshop);
                if (firstWorkshop && firstWorkshop.workshop_name) {
                    document.getElementById('login-workshop-name').innerText = firstWorkshop.workshop_name;
                    document.getElementById('login-workshop-badge').classList.remove('hidden');
                }
            }
        }

        function renderDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('change-password-screen').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('app-header').classList.remove('hidden');
    
            let pName = currentActiveUser.ps_name || "Participant";
            let pId = currentActiveUser.ps_id || "N/A";
            let pMob = maskMobile(currentActiveUser.ps_mob);
            let pEmail = maskEmail(currentActiveUser.ps_email);
            let pCentre = currentActiveUser.ps_centre || "N/A";
            let pZone = currentActiveUser.ps_zone || "N/A";
            let pState = currentActiveUser.ps_state || "N/A";
            const headerInfo = document.getElementById('header-user-info');
            headerInfo.innerHTML = `
                <div class="grid grid-cols-1 gap-y-1 text-xs sm:text-sm">
                    <div><strong>Name:</strong> ${pName}</div>
                    <div><strong>Unique ID Number:</strong> ${pId}</div>
                    <div><strong>Mobile Number:</strong> ${pMob}</div>
                    <div><strong>Email Address:</strong> ${pEmail}</div>
                    <div><strong>Centre:</strong> ${pCentre}</div>
                    <div><strong>Zone:</strong> ${pZone}</div>
                    <div><strong>State:</strong> ${pState}</div>
                </div>
            `;
    
            let wId = currentActiveUser.workshop_id;
            let workshop = allWorkshops[wId] || {};
            let workshopName = workshop.workshop_name || "Workshop Name Not Available";
            document.getElementById('workshop-title-display').innerText = workshopName;
            const resourcesContainer = document.getElementById('resources-container');
            resourcesContainer.innerHTML = '';
            const resourceLinks = [
                { 
                    eng: "Personalized zoom link to join the workshop", 
                    hin: "वर्कशॉप में शामिल होने के लिए पर्सनलाइज़्ड ज़ूम लिंक", 
                    btnText: "Join Zoom (जूम ज्वाइन करें)",

        function maskMobile(mob) {
            if (!mob) return "***";
            let s = mob.toString().trim();
            if (s.length <= 4) return "****";
            return s.substring(0, 2) + "****" + s.substring(s.length - 2);
        }

        function maskEmail(email) {
            if (!email || !email.includes("@")) return "***@***.com";
            let parts = email.toString().trim().split("@");
            let name = parts[0];
            let domain = parts[1];
            let maskedName = name.length > 2 ? name.substring(0, 2) + "***" : "***";
            return maskedName + "@" + domain;
        }

// Global variable to hold the zone-state master mapping
let zoneStateMapping = {};

// 1. Fetch Master List Zone State from Firebase when opening the profile modal
function fetchZoneStateMaster() {
    db.ref('control_tower/Master_List_Zone_State').once('value').then(snapshot => {
        const data = snapshot.val();
        if (data) {
            zoneStateMapping = data;
            populateStateDropdown();
        }
    }).catch(error => {
        console.error("Error fetching zone-state master:", error);
    });
}

// 2. Populate the State dropdown dynamically
function populateStateDropdown() {
    let stateSelect = document.getElementById('update-profile-state');
    if (!stateSelect) return;
    
    // Save current state value if any, to retain selection if re-opened
    let currentValue = stateSelect.value || (currentActiveUser ? currentActiveUser.ps_state : "");
    
    stateSelect.innerHTML = '<option value="">Select State</option>';
    
    Object.keys(zoneStateMapping).forEach(state => {
        let option = document.createElement('option');
        option.value = state;
        option.textContent = state;
        if (state === currentValue) {
            option.selected = true;
        }
        stateSelect.appendChild(option);
    });
    
    // Trigger zone population based on the selected state
    onStateSelected();
}

// 3. Automatically update Zone options when State changes
function onStateSelected() {
    let stateSelect = document.getElementById('update-profile-state');
    let zoneSelect = document.getElementById('update-profile-zone');
    
    if (!stateSelect || !zoneSelect) return;
    
    let selectedState = stateSelect.value;
    let currentZoneValue = zoneSelect.value || (currentActiveUser ? currentActiveUser.ps_zone : "");
    
    zoneSelect.innerHTML = '<option value="">Select Zone</option>';
    
    if (selectedState && zoneStateMapping[selectedState]) {
        zoneStateMapping[selectedState].forEach(zone => {
            let option = document.createElement('option');
            option.value = zone;
            option.textContent = zone;
            if (zone === currentZoneValue) {
                option.selected = true;
            }
            zoneSelect.appendChild(option);
        });
    }
}

// 4. Existing Save Profile Changes function with Zone & State logic intact
function saveProfileChanges() {
    if (!currentActiveUser) return;
    
    let emailInput = document.getElementById('update-profile-email');
    if (emailInput && !emailInput.disabled) {
        showCustomAlert("Please lock/verify your email address before saving changes.");
        emailInput.focus();
        return;
    }
    
    let participantKey = currentActiveUser.ps_id ? currentActiveUser.ps_id.toString().trim().replace(/[\.\#\$\[\]\/]/g, "_").replace(/\s+/g, "_") : "";
    if (!participantKey) {
        showCustomAlert("Invalid Participant ID.");
        return;
    }
    
    let newMob = document.getElementById('update-profile-mob').value.trim();
    let newEmail = emailInput.value.trim();
    let newCentre = document.getElementById('update-profile-centre').value.trim();
    let newZone = document.getElementById('update-profile-zone').value.trim();
    let newState = document.getElementById('update-profile-state').value.trim();
    
    // Build payload dynamically by comparing with currentActiveUser to track exact changes
    let payload = {};
    let updatedFieldsList = [];

    if (newMob !== (currentActiveUser.ps_mob || "")) {
        payload.ps_mob = newMob;
        updatedFieldsList.push("ps_mob");
    }
    if (newEmail !== (currentActiveUser.ps_email || "")) {
        payload.ps_email = newEmail;
        updatedFieldsList.push("ps_email");
    }
    if (newCentre !== (currentActiveUser.ps_centre || "")) {
        payload.ps_centre = newCentre;
        updatedFieldsList.push("ps_centre");                
    }
    if (newZone !== (currentActiveUser.ps_zone || "")) {
        payload.ps_zone = newZone;
        updatedFieldsList.push("ps_zone");
    }
    if (newState !== (currentActiveUser.ps_state || "")) {
        payload.ps_state = newState;
        updatedFieldsList.push("ps_state");
    }

    if (Object.keys(payload).length === 0) {
        showCustomAlert("No changes detected to save.");
        return;
    }

    // Include fieldupdated in the payload so it syncs correctly to Firebase and Sheet
    payload.fieldupdated = updatedFieldsList.join(", ");
    payload.lastsyntimestamp = new Date().toLocaleString();

    let statusDiv = document.getElementById('profile-update-status');
    if (statusDiv) {
        statusDiv.innerText = "Your Profile is being updated.... Please wait.....";
        statusDiv.classList.remove('hidden');
    }

    db.ref('control_tower/participants/' + participantKey).update(payload).then(() => {
        currentActiveUser.ps_mob = newMob;
        currentActiveUser.ps_email = newEmail;
        currentActiveUser.ps_centre = newCentre;
        currentActiveUser.ps_zone = newZone;
        currentActiveUser.ps_state = newState;
        
        if (statusDiv) statusDiv.classList.add('hidden');
        showCustomAlert("Profile updated successfully!");
        closeUpdateProfileModal();
        renderDashboard();

    }).catch(err => {
        if (statusDiv) statusDiv.classList.add('hidden');
        showCustomAlert("Firebase update error: " + err);
    });
}
        


function enableField(fieldType) {
    let inputElem = document.getElementById('update-profile-' + fieldType);
    let btnElem = document.getElementById('btn-' + fieldType);
    if (!inputElem || !btnElem) return;
    
    let isLocked = inputElem.disabled;
    
    if (isLocked) {
        // Unlock for editing
        inputElem.disabled = false;
        inputElem.classList.remove('bg-gray-100', 'cursor-not-allowed');
        inputElem.classList.add('bg-white', 'ring-2', 'ring-indigo-500');
        inputElem.focus();
        
        btnElem.textContent = "Done";
        btnElem.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
        btnElem.classList.add('bg-green-600', 'hover:bg-green-700', 'text-white');
        
        let saveBtn = document.getElementById('save-profile-btn');
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'text-white', 'cursor-pointer');
            saveBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
        }
    } else {
        // Clicked "Done"
        let val = inputElem.value.trim();
        
        if (fieldType === 'email') {
            if (!validateEmailFormat(val)) {
                showCustomAlert("Please check the email entered by you. It does not have a proper format (missing '@' or domain).");
                inputElem.focus();
                return; // Keep open until valid format is provided
            }
            
            // Lock field back down visually
            inputElem.disabled = true;
            inputElem.classList.add('bg-gray-100', 'cursor-not-allowed');
            inputElem.classList.remove('bg-white', 'ring-2', 'ring-indigo-500');
            
            btnElem.textContent = "Edit";
            btnElem.classList.remove('bg-green-600', 'hover:bg-green-700', 'text-white');
            btnElem.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
            
            // Trigger email verification dispatch safely with the validated value
            triggerEmailVerification(val);
            
        } else if (fieldType === 'mob') {
            // Validate Indian mobile number (e.g., 10 digits starting with 6-9, or optional +91 prefix)
            const mobileRegex = /^(\+91[\-\s]?)?[6-9]\d{9}$/;
            if (!mobileRegex.test(val)) {
                showCustomAlert("Please enter a valid 10-digit Indian mobile number starting with digits 6 through 9.");
                inputElem.focus();
                return; // Keep open until valid format is provided
            }
            
            // Lock field back down visually
            inputElem.disabled = true;
            inputElem.classList.add('bg-gray-100', 'cursor-not-allowed');
            inputElem.classList.remove('bg-white', 'ring-2', 'ring-indigo-500');
            
            btnElem.textContent = "Edit";
            btnElem.classList.remove('bg-green-600', 'hover:bg-green-700', 'text-white');
            btnElem.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
            
            let saveBtn = document.getElementById('save-profile-btn');
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                saveBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white', 'cursor-pointer');
            }
            
        } else {
            // For Centre, State or other fields
            inputElem.disabled = true;
            inputElem.classList.add('bg-gray-100', 'cursor-not-allowed');
            inputElem.classList.remove('bg-white', 'ring-2', 'ring-indigo-500');
            
            btnElem.textContent = "Edit";
            btnElem.classList.remove('bg-green-600', 'hover:bg-green-700', 'text-white');
            btnElem.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
            
            let saveBtn = document.getElementById('save-profile-btn');
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                saveBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white', 'cursor-pointer');
            }
        }
    }
}



        
        function triggerEmailVerification(emailVal) {
            let statusElem = document.getElementById('profile-update-status');
            statusElem.textContent = "Sending verification code to " + emailVal + "... Please wait.";
            statusElem.classList.remove('hidden', 'text-red-600', 'text-green-600');
            statusElem.classList.add('text-blue-600');
            
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "sendEmailVerificationCode", email: emailVal })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "Success") {
                    statusElem.textContent = "Verification code sent successfully! Please check your inbox.";
                    statusElem.classList.remove('text-blue-600');
                    statusElem.classList.add('text-green-600');
                    
                    setTimeout(() => {
                        openVerificationPopup(emailVal);
                    }, 600);
                } else {
                    statusElem.classList.add('hidden');
                    showCustomAlert("Error: " + result.message);
                    
                    // Re-enable email field if backend dispatch failed
                    let emailInput = document.getElementById('update-profile-email');
                    if (emailInput) emailInput.disabled = false;
                }
            })
            .catch(error => {
                statusElem.classList.add('hidden');
                showCustomAlert("Network error while sending code: " + error.toString());
                
                let emailInput = document.getElementById('update-profile-email');
                if (emailInput) emailInput.disabled = false;
            });
        }







function validateEmailFormat(email) {
    if (!email) return false;
    
    // 1. Basic structural check (@ and single dot in domain)
    let re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!re.test(email)) return false;
    
    // 2. Prevent consecutive dots (e.g., test..email@gmail.com)
    if (email.includes('..')) return false;
    
    // 3. Split into local part and domain
    let parts = email.split('@');
    if (parts.length !== 2) return false;
    let localPart = parts[0];
    let domain = parts[1];
    
    // 4. Local part or domain cannot start or end with a dot
    if (localPart.startsWith('.') || localPart.endsWith('.') || domain.startsWith('.') || domain.endsWith('.')) {
        return false;
    }
    
    // 5. Ensure domain has at least one valid top-level domain (TLD) of at least 2 characters, 
    // and prevent bizarre multi-level gibberish extensions like .comfdfdf.in.fdsf
    let domainParts = domain.split('.');
    let tld = domainParts[domainParts.length - 1];
    if (tld.length < 2) return false;
    
    // Optional: restrict maximum TLD length to avoid absurd entries (e.g. max 6-7 chars for standard TLDs)
    if (tld.length > 10) return false;

    return true;
}

            // Hide the modal if the user cancels

        function handleVerifyCodeClick() {
            let enteredCode = document.getElementById("verificationInput").value;
            
            if (!enteredCode || enteredCode.trim() === "") {
                alert("Please enter the verification code.");
                return;
            }

            // Hide the modal
            document.getElementById("customVerificationModal").classList.add("hidden");
            
            // Pass both the stored email and the trimmed code to your existing verification function
            verifyCodeWithBackend(currentVerificationEmail, enteredCode.trim());
        }

   
      

        function verifyCodeWithBackend(email, code) {
            let statusElem = document.getElementById('profile-update-status');
            statusElem.textContent = "Verifying code...";
            statusElem.classList.remove('hidden');
            
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "verifyEmailCode", email: email, code: code })
            })
            .then(response => response.json())
            .then(result => {
                statusElem.classList.add('hidden');
                if (result.status === "Success") {
                    showCustomAlert("Email verified successfully! You can now click 'Save Changes'.");
                    
                    let emailInput = document.getElementById('update-profile-email');
                    emailInput.disabled = true;
                    emailInput.classList.add('bg-gray-100', 'cursor-not-allowed');
                    emailInput.classList.remove('bg-white', 'ring-2', 'ring-indigo-500');
                    
                    let saveBtn = document.getElementById('save-profile-btn');
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                        saveBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white', 'cursor-pointer');
                    }
                } else {
                    showCustomAlert("Verification Failed: " + result.message);
                }
            })
            .catch(error => {
                statusElem.classList.add('hidden');
                showCustomAlert("Network error during code verification: " + error.toString());
            });
        }
