    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAt_HbqtG_kMn41NC1wPy5KDFNsDp5HTb8",
            authDomain: "hc-app-72298.firebaseapp.com",
            databaseURL: "https://hc-app-72298-default-rtdb.asia-southeast1.firebasedatabase.app",

        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allParticipants = {};
        let allWorkshops = {};
        let currentActiveUser = null;
        let selectedParticipantKey = null;
        
        let cpSelectedKey = null;
        let rpSelectedKey = null;





        
function loadFirebaseData() {
            db.ref('control_tower').once('value').then(snapshot => {
                const data = snapshot.val();
                console.log("Firebase Raw Data Loaded for control_tower:", data);
                if (data) {
                    allParticipants = data.participants || {};
                    allWorkshops = data.workshops || {};
                    
                    console.log("Parsed allParticipants:", allParticipants);
                    console.log("Parsed allWorkshops:", allWorkshops);
                    
                    updateLoginWorkshopBadge();
                } else {
                    console.warn("Firebase returned empty data for control_tower.");
                }
            }).catch(err => console.error("Error fetching data from Firebase:", err));




    

   // Fetch and display persistent global header logo based on Firebase control config
        db.ref('control_tower/config/logo_config').on('value', (snapshot) => {
            const config = snapshot.val();
            console.log("Logo Config fetched:", config);
            
            const logoContainer = document.getElementById('global-header');
            const logoElement = document.getElementById('app-logo');
            
            if (config && config.status === "ON" && config.image) {
                logoElement.src = config.image;
                logoContainer.classList.remove('hidden'); // Show logo box
            } else {
                logoContainer.classList.add('hidden');    // Hide completely if OFF or empty
            }
        });
    


    
        }

        window.onload = loadFirebaseData;








        function updateLoginWorkshopBadge() {
            let workshopKeys = Object.keys(allWorkshops);
            console.log("Workshop Keys available:", workshopKeys);
            if (workshopKeys.length > 0) {
                let firstWorkshop = allWorkshops[workshopKeys[0]];
                console.log("First Workshop Object:", firstWorkshop);
                if (firstWorkshop && firstWorkshop.workshop_name) {
                    document.getElementById('login-workshop-name').innerText = firstWorkshop.workshop_name;
                    document.getElementById('login-workshop-badge').classList.remove('hidden');
                }
            }
        }



function renderDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('change-password-screen').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('app-header').classList.remove('hidden');



    
let pName = currentActiveUser.ps_name || "Participant";
            let pId = currentActiveUser.ps_id || "N/A";
            let pMob = maskMobile(currentActiveUser.ps_mob);
            let pEmail = maskEmail(currentActiveUser.ps_email);
            let pCentre = currentActiveUser.ps_centre || "N/A";
            let pState = currentActiveUser.ps_state || "N/A";

            const headerInfo = document.getElementById('header-user-info');
            headerInfo.innerHTML = `
                <div class="grid grid-cols-1 gap-y-1 text-xs sm:text-sm">
                    <div><strong>Name:</strong> ${pName}</div>
                    <div><strong>Unique ID Number:</strong> ${pId}</div>
                    <div><strong>Mobile Number:</strong> ${pMob}</div>
                    <div><strong>Email Address:</strong> ${pEmail}</div>
                    <div><strong>Centre:</strong> ${pCentre}</div>
                    <div><strong>State:</strong> ${pState}</div>
                </div>
            `;




    

            let wId = currentActiveUser.workshop_id;
            let workshop = allWorkshops[wId] || {};
            let workshopName = workshop.workshop_name || "Workshop Name Not Available";
            document.getElementById('workshop-title-display').innerText = workshopName;

            const resourcesContainer = document.getElementById('resources-container');
            resourcesContainer.innerHTML = '';

            const resourceLinks = [
                { 
                    eng: "Personalized zoom link to join the workshop", 
                    hin: "वर्कशॉप में शामिल होने के लिए पर्सनलाइज़्ड ज़ूम लिंक", 
                    btnText: "Join Zoom (जूम ज्वाइन करें)", 
                    link: currentActiveUser.personal_zoom_link 
                },
                { 
                    eng: "Participant WhatsApp Group Joining Link", 
                    hin: "प्रतिभागी व्हाट्सएप ग्रुप ज्वाइन करने का लिंक", 
                    btnText: "Join Group (ग्रुप ज्वाइन करें)", 
                    link: workshop.participant_wg_link 
                },
                { 
                    eng: "Workshop Schedule Link", 
                    hin: "वर्कशॉप शेड्यूल लिंक", 
                    btnText: "View Schedule (शेड्यूल देखें)", 
                    link: workshop.workshop_shedule_link 
                },
                { 
                    eng: "Material/Handbook Link", 
                    hin: "सामग्री / हैंडबुक लिंक", 
                    btnText: "Read Material (सामग्री देखें)", 
                    link: workshop.material_link 
                },
                { 
                    eng: "Participant Feedback Link", 
                    hin: "प्रतिभागी फीडबैक लिंक", 
                    btnText: "Give Feedback (फीडबैक दें)", 
                    link: workshop.participant_feedback_link 
                }
            ];

            resourceLinks.forEach(res => {
                let row = document.createElement('div');
                // Distinct card borders, spacing, and modern padding layout
                row.className = "bg-white border border-gray-200 rounded-xl p-4 mb-3 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center hover:shadow transition";
                
                let linkVal = res.link ? res.link.toString().trim() : "";
                let isLinkValid = linkVal.startsWith('http://') || linkVal.startsWith('https://');

                let textContainer = document.createElement('div');
                textContainer.className = "mb-3 sm:mb-0 sm:mr-4 pr-2";
                textContainer.innerHTML = `
                    <div class="text-gray-900 font-semibold text-xs sm:text-sm">${res.eng}</div>
                    <div class="text-gray-500 font-normal text-xs mt-0.5">${res.hin}</div>
                `;
                row.appendChild(textContainer);

                if (isLinkValid) {
                    let a = document.createElement('a');
                    a.href = linkVal;
                    a.target = "_blank";
                    a.className = "bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 px-4 rounded-lg transition shadow flex-shrink-0 text-center";
                    a.innerText = res.btnText;
                    row.appendChild(a);
                } else {
                    let span = document.createElement('span');
                    span.className = "text-gray-400 text-xs italic flex-shrink-0";
                    span.innerText = "Not Available";
                    row.appendChild(span);
                }

                resourcesContainer.appendChild(row);
            });
        }









        

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                input.type = "password";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function filterParticipants() {
            const query = document.getElementById('search-name').value.toLowerCase();
            const resultsBox = document.getElementById('search-results');

        function maskMobile(mob) {
            if (!mob) return "***";
            let s = mob.toString().trim();
            if (s.length <= 4) return "****";
            return s.substring(0, 2) + "****" + s.substring(s.length - 2);
        }

        function maskEmail(email) {
            if (!email || !email.includes("@")) return "***@***.com";
            let parts = email.toString().trim().split("@");
            let name = parts[0];
            let domain = parts[1];
            let maskedName = name.length > 2 ? name.substring(0, 2) + "***" : "***";
            return maskedName + "@" + domain;
        }

function clearForms() {
    // Reset login inputs
    let loginInput = document.getElementById('search-name');
    let passInput = document.getElementById('login-password');
    let selectedDisplay = document.getElementById('selected-participant-display');
    let selectedContainer = document.getElementById('selected-participant-container');
    
    if (loginInput) loginInput.value = '';
    if (passInput) passInput.value = '';
    if (selectedDisplay) selectedDisplay.value = '';
    if (selectedContainer) selectedContainer.classList.add('hidden');
    selectedParticipantKey = null;

    // Reset Change Password form inputs
    let cpSearch = document.getElementById('cp-search-name');
    let cpDisplay = document.getElementById('cp-selected-display');
    let cpCurrent = document.getElementById('cp-current-password');
    let cpNew = document.getElementById('cp-new-password');
    let cpConfirm = document.getElementById('cp-confirm-password');
    
    if (cpSearch) cpSearch.value = '';
    if (cpDisplay) cpDisplay.value = '';
    if (cpCurrent) cpCurrent.value = '';
    if (cpNew) cpNew.value = '';
    if (cpConfirm) cpConfirm.value = '';
    cpSelectedKey = null;

    // Reset Reset Password form inputs
    let rpSearch = document.getElementById('rp-search-name');
    let rpDisplay = document.getElementById('rp-selected-display');
    
    if (rpSearch) rpSearch.value = '';
    if (rpDisplay) rpDisplay.value = '';
    rpSelectedKey = null;
}
        
function showCustomAlert(message) {
            document.getElementById('custom-alert-message').innerText = message;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

function openUpdateProfileModal() {
    if (!currentActiveUser) return;
    
    // Populate fields with current values (unmasked for editing)
    document.getElementById('update-profile-name').value = currentActiveUser.ps_name || "";
    document.getElementById('update-profile-id').value = currentActiveUser.ps_id || "";
    document.getElementById('update-profile-mob').value = currentActiveUser.ps_mob || "";
    document.getElementById('update-profile-email').value = currentActiveUser.ps_email || "";
    document.getElementById('update-profile-centre').value = currentActiveUser.ps_centre || "";
    document.getElementById('update-profile-state').value = currentActiveUser.ps_state || "";
    
    // Hide dashboard contents / show update profile container
    document.getElementById('dashboard-screen').classList.add('hidden');
    document.getElementById('update-profile-screen').classList.remove('hidden');
}

function closeUpdateProfileModal() {
    document.getElementById('update-profile-screen').classList.add('hidden');
    document.getElementById('dashboard-screen').classList.remove('hidden');
}


function saveProfileChanges() {
    if (!currentActiveUser) return;
    
    let participantKey = currentActiveUser.ps_id ? currentActiveUser.ps_id.toString().trim().replace(/[\.\#\$\[\]\/]/g, "_").replace(/\s+/g, "_") : "";
    if (!participantKey) {
        showCustomAlert("Invalid Participant ID.");
        return;
    }
    
    let newMob = document.getElementById('update-profile-mob').value.trim();
    let newEmail = document.getElementById('update-profile-email').value.trim();
    let newCentre = document.getElementById('update-profile-centre').value.trim();
    let newState = document.getElementById('update-profile-state').value.trim();
    
    // 1. Show the "Please wait..." loading message immediately
    let statusDiv = document.getElementById('profile-update-status');
    if (statusDiv) {
        statusDiv.innerText = "Your Profile is being updated.... Please wait.....";
        statusDiv.classList.remove('hidden');
    }
    
    // 2. Instantly update Firebase from the browser
    db.ref('control_tower/participants/' + participantKey).update({
        ps_mob: newMob,
        ps_email: newEmail,
        ps_centre: newCentre,
        ps_state: newState
    }).then(() => {
        // Update local session cache instantly
        currentActiveUser.ps_mob = newMob;
        currentActiveUser.ps_email = newEmail;
        currentActiveUser.ps_centre = newCentre;
        currentActiveUser.ps_state = newState;
        
        // 3. Clear loading message and show success message
        if (statusDiv) statusDiv.classList.add('hidden');
        showCustomAlert("Profile updated successfully!");
        closeUpdateProfileModal();
        renderDashboard();
    }).catch(err => {
        if (statusDiv) statusDiv.classList.add('hidden');
        showCustomAlert("Firebase update error: " + err);
    });
}
