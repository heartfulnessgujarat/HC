<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartful Communication - Facilitator Training Workshop (FT3H) | Participant Portal</title>
    
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">
    <!-- Persistent Global Header Logo -->
    <div id="global-header" class="max-w-xl mx-auto w-full px-4 pt-2 hidden">
        <div class="bg-white rounded-xl shadow-md p-0 overflow-hidden">
            <img id="app-logo" src="" alt="App Logo" class="w-full h-auto object-cover" />
        </div>
    </div>
    
    <!-- Top Header Bar -->
    <header id="app-header" class="max-w-xl mx-auto px-4 pt-2 hidden w-full">
        <div class="bg-blue-50 border border-blue-200 text-blue-900 shadow-sm rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center w-full">
            <div id="header-user-info" class="w-full mb-3 sm:mb-0">
                <!-- Populated dynamically via renderDashboard -->
            </div>
            <div class="flex-shrink-0 self-end sm:self-center flex space-x-2">
                <button onclick="openUpdateProfileModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1.5 px-3 rounded transition shadow">
                    Update Profile
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1.5 px-3 rounded transition shadow">
                    Logout
                </button>
            </div>
        </div>
    </header>
    
    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 py-3 flex-grow w-full">
        <!-- SCREEN 1: LOGIN VIEW -->
        <div id="login-screen" class="bg-white rounded-xl shadow-md p-4 sm:p-6 mt-2">
            <div id="login-workshop-badge" class="text-center mb-1 hidden">
                <span id="login-workshop-name" class="text-xs uppercase tracking-widest bg-indigo-50 text-indigo-600 px-3 py-0.5 rounded-full font-semibold">--</span>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Participant Login</h2>
            
            <div class="mb-3 relative">
                <label class="block text-gray-700 text-xs font-bold mb-1">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="search-name" autocomplete="off" placeholder="e.g. Raj" class="w-full px-3 py-1.5 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterParticipants()">
                <div id="search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>
            
            <div id="selected-participant-container" class="mb-3 hidden">
                <label class="block text-gray-700 text-xs font-bold mb-1">Name of the Participant:</label>
                <input type="text" id="selected-participant-display" readonly class="w-full px-3 py-1.5 text-sm bg-gray-100 border rounded-lg text-gray-600">
            </div>
            
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-xs font-bold mb-1">Password:</label>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="Enter password" class="w-full px-3 py-1.5 text-sm pr-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                        <svg id="login-eye-icon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 text-sm rounded-lg transition mb-3">
                Login
            </button>
            
            <div class="flex justify-between items-center text-xs px-1">
                <a href="#" onclick="showChangePasswordScreen()" class="text-indigo-600 hover:underline font-medium">Change Password</a>
                <a href="#" onclick="showResetPasswordScreen()" class="text-indigo-600 hover:underline font-medium">Reset Password</a>
            </div>
        </div>
        
        <!-- SCREEN 2: DASHBOARD VIEW -->
        <div id="dashboard-screen" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md rounded-xl py-3 px-6 text-center mb-6">
                <h2 id="workshop-title-display" class="text-lg font-bold"></h2>
            </div>
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="bg-gray-100 px-6 py-4 border-b text-center">
                    <h3 class="text-lg font-bold text-gray-800">Participant Resources</h3>
                </div>
                <div class="divide-y divide-gray-200" id="resources-container"></div>
            </div>
        </div>

        <!-- SCREEN 3: CHANGE PASSWORD SCREEN -->
        <div id="change-password-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Change Password</h2>
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="cp-search-name" placeholder="e.g. Raj" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterChangePasswordParticipants()">
                <div id="cp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Name of the Participant:</label>
                <input type="text" id="cp-selected-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600" placeholder="Selected participant name">
            </div>
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Current Password:</label>
                <input type="password" id="cp-current-password" placeholder="Current Password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">New Password (Max 6 Chars):</label>
                <input type="password" id="cp-new-password" placeholder="New Password" maxlength="6" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-6 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Confirm New Password:</label>
                <input type="password" id="cp-confirm-password" placeholder="Confirm New Password" maxlength="6" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="submitChangePassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition mb-3">
                Update Password
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                Back to Login
            </button>
        </div>

        <!-- SCREEN 4: RESET PASSWORD SCREEN -->
        <div id="reset-password-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Reset Password</h2>
            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2">Type your name in English, (at least 3 letters):</label>
                <input type="text" id="rp-search-name" placeholder="e.g. Raj" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterResetPasswordParticipants()">
                <div id="rp-search-results" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg max-h-40 overflow-y-auto hidden z-20"></div>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Name of the Participant:</label>
                <input type="text" id="rp-selected-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600" placeholder="Selected participant name">
            </div>
            <button onclick="submitResetPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition mb-3">
                Reset Password to 123456
            </button>
            <button onclick="showLoginScreen()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                Back to Login
            </button>
        </div>

        <!-- SCREEN 5: UPDATE PROFILE SCREEN -->
        <div id="update-profile-screen" class="bg-white rounded-xl shadow-md p-6 sm:p-8 mt-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Update Profile Details</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Name (Read-only)</label>
                    <input type="text" id="update-profile-name" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Unique ID Number (Read-only)</label>
                    <input type="text" id="update-profile-id" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Mobile Number</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="update-profile-mob" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-mob" onclick="enableField('mob')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg transition flex-shrink-0">Edit</button>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Email Address</label>
                    <div class="flex items-center space-x-2">
                        <input type="email" id="update-profile-email" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-email" onclick="enableField('email')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg transition flex-shrink-0">Edit</button>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Centre</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="update-profile-centre" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed">
                        <button type="button" id="btn-centre" onclick="enableField('centre')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg transition flex-shrink-0">Edit</button>
                    </div>
                </div>
                <div class="relative">
                    <label class="block text-gray-700 text-sm font-bold mb-1">State</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="update-profile-state" autocomplete="off" disabled class="w-full bg-gray-100 border rounded-lg px-3 py-2 text-gray-600 cursor-not-allowed" oninput="handleStateInput(this.value)">
                        <button type="button" id="btn-state" onclick="enableField('state')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg transition flex-shrink-0">Edit</button>
                    </div>
                    <div id="state-suggestions" class="absolute z-50 left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-lg mt-1 max-h-40 overflow-y-auto hidden"></div>
                </div>    
            </div>
            
            <p id="profile-update-status" class="text-sm text-blue-600 font-medium hidden my-3 text-center"></p>
            
            <div class="mt-6 space-y-3">
                <button id="save-profile-btn" onclick="saveProfileChanges()" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-2 px-4 rounded-lg cursor-not-allowed transition">
                    Save Changes
                </button>
                <button onclick="closeUpdateProfileModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                    Cancel / Back to Dashboard
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-500">
        Heartful Communication - Participant Login System
    </footer>

    <!-- Custom Message Box Modal -->
    <div id="custom-alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center transform transition-all">
            <div id="custom-alert-message" class="text-gray-800 text-sm mb-6 font-medium"></div>
            <button onclick="closeCustomAlert()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 px-6 rounded transition shadow">
                OK
            </button>
        </div>
    </div>

    <!-- Custom Verification Modal -->
    <div id="customVerificationModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Enter Verification Code</h3>
            <p id="modalMessage" class="text-sm text-gray-600 mb-4">A 6-digit verification code has been sent to your email.</p>
            <input type="text" id="verificationInput" maxlength="6" placeholder="Enter 6-digit code" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-center tracking-widest text-lg">
            <div class="flex justify-end space-x-2">
                <button onclick="closeVerificationModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 text-sm">Cancel</button>
                <button onclick="handleVerifyCodeClick()" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 text-sm">Verify</button>
            </div>
        </div>
    </div>


<script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5M-tuxgcJb9_4G3q96MZ4XII8DK56_i_MtaUi_oGYRWmoRISUHeL-L73aladft49R/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAt_HbqtG_kMn41NC1wPy5KDFNsDp5HTb8",
            authDomain: "hc-app-72298.firebaseapp.com",
            databaseURL: "https://hc-app-72298-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hc-app-72298",
            storageBucket: "hc-app-72298.firebasestorage.app",
            messagingSenderId: "1013251414152",
            appId: "1:1013251414152:web:3e598848e31a81bb43273d"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        let allParticipants = {};
        let allWorkshops = {};
        let currentActiveUser = null;
        let selectedParticipantKey = null;
        let cpSelectedKey = null;
        let rpSelectedKey = null;
        let availableStates = [];
        let currentVerificationEmail = "";

        function loadFirebaseData() {
            db.ref('control_tower').once('value').then(snapshot => {
                const data = snapshot.val();
                console.log("--- FIREBASE FULL SNAPSHOT ---", data);
                if (data) {
                    allWorkshops = data.workshops || {};
                    
                    // Flatten participants if they are nested under workshop keys (e.g. data.participants.FT3H)
                    let rawParticipants = data.participants || {};
                    allParticipants = {};
                    
                    Object.keys(rawParticipants).forEach(outerKey => {
                        let item = rawParticipants[outerKey];
                        // Check if it's a nested group or a direct participant record
                        if (item && typeof item === 'object' && !item.ps_name) {
                            // It's a grouping node, pull inner children out
                            Object.keys(item).forEach(innerKey => {
                                allParticipants[innerKey] = item[innerKey];
                            });
                        } else {
                            allParticipants[outerKey] = item;
                        }
                    });

                    console.log("--- FLATTENED PARTICIPANTS ---", allParticipants);
                    loadStatesData(data.states);
                    updateLoginWorkshopBadge();
                } else {
                    console.warn("Firebase returned empty data for control_tower.");
                }
            }).catch(err => console.error("Error fetching data from Firebase:", err));
    
            db.ref('control_tower/config/logo_config').on('value', (snapshot) => {
                const config = snapshot.val();
                const logoContainer = document.getElementById('global-header');
                const logoElement = document.getElementById('app-logo');
                
                if (config && config.status === "ON" && config.image) {
                    logoElement.src = config.image;
                    logoContainer.classList.remove('hidden');
                } else {
                    logoContainer.classList.add('hidden');
                }
            });
        }
        window.onload = loadFirebaseData;
        
        function updateLoginWorkshopBadge() {
            let workshopKeys = Object.keys(allWorkshops);
            if (workshopKeys.length > 0) {
                let firstWorkshop = allWorkshops[workshopKeys[0]];
                if (firstWorkshop && firstWorkshop.workshop_name) {
                    document.getElementById('login-workshop-name').innerText = firstWorkshop.workshop_name;
                    document.getElementById('login-workshop-badge').classList.remove('hidden');
                }
            }
        }

        function filterParticipants() {
            const query = document.getElementById('search-name').value.toLowerCase().trim();
            const resultsBox = document.getElementById('search-results');
            resultsBox.innerHTML = '';
            
            console.log("Filtering participants with query:", query);
            
            if (query.length < 3) {
                resultsBox.classList.add('hidden');
                return;
            }
            
            let matches = [];
            for (let key in allParticipants) {
                let p = allParticipants[key];
                if (p && p.ps_name) {
                    let pName = p.ps_name.toLowerCase();
                    if (pName.includes(query)) {
                        matches.push({ key: key, data: p });
                    }
                }
            }
            
            console.log("Search matches found:", matches.length);

            if (matches.length > 0) {
                resultsBox.classList.remove('hidden');
                matches.forEach(m => {
                    let div = document.createElement('div');
                    div.className = "px-4 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b bg-white";
                    div.innerText = m.data.ps_name;
                    div.onclick = () => selectParticipant(m.key, m.data);
                    resultsBox.appendChild(div);
                });
            } else {
                resultsBox.classList.add('hidden');
            }
        }

        function selectParticipant(key, data) {
            selectedParticipantKey = key;
            document.getElementById('search-name').value = data.ps_name;
            document.getElementById('selected-participant-display').value = data.ps_name;
            document.getElementById('selected-participant-container').classList.remove('hidden');
            document.getElementById('search-results').classList.add('hidden');
        }

        function handleLogin() {
            const passwordInput = document.getElementById('login-password').value;
            if (!selectedParticipantKey || !allParticipants[selectedParticipantKey]) {
                showCustomAlert("Please search and select a valid participant.");
                return;
            }
            let user = allParticipants[selectedParticipantKey];
            let storedPassword = user.password ? user.password.toString() : "123456";
            if (passwordInput === storedPassword) {
                currentActiveUser = user;
                renderDashboard();
            } else {
                showCustomAlert("Incorrect password. Please try again.");
            }
        }

        function showCustomAlert(message) {
            document.getElementById('custom-alert-message').innerText = message;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }
        
        function loadStatesData(statesNode) {
            availableStates = [];
            if (!statesNode) return;
            if (Array.isArray(statesNode)) {
                availableStates = statesNode.filter(Boolean).map(st => st.toString().trim());
            } else {
                for (let key in statesNode) {
                    let item = statesNode[key];
                    if (typeof item === 'string') availableStates.push(item.trim());
                    else if (item && item.state) availableStates.push(item.state.toString().trim());
                    else if (item && item.name) availableStates.push(item.name.toString().trim());
                }
            }
        }
    </script>

































    
</body>
</html>
